<!DOCTYPE html>
<!-- Agenda interna · PRECISSA INSTITUTE
     App privada: fichas de clientas, agenda e histórico de tratamientos.
     NO se enlaza desde la web pública ni se incluye en el sitemap. Pero
     lo que de verdad la protege es el login de Supabase + las políticas
     RLS de supabase/agenda.sql, no el hecho de estar oculta. -->
<html lang="es-ES">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Agenda · PRECISSA INSTITUTE</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F2ECE3">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="agenda.css?v=4">
</head>
<body>

<!-- ═══ LOGIN ═══════════════════════════════════════════════ -->
<!-- La pantalla de acceso es deliberadamente neutra: no describe qué hay
     detrás. Contar que aquí se guardan datos de clientas solo sirve para
     dar pistas a quien no debería estar mirando. -->
<div id="login-view" class="login-wrap">
  <div class="login-box">
    <div class="brand">PRECISSA INSTITUTE</div>
    <h1>Acceso restringido</h1>
    <p>Identifícate para continuar.</p>

    <button type="button" class="btn btn-outline" style="width:100%;margin-bottom:16px" id="li-google">
      <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.76h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.76c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.11a6.6 6.6 0 0 1 0-4.22V7.05H2.18a11 11 0 0 0 0 9.9l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1a11 11 0 0 0-9.82 6.05l3.66 2.84c.87-2.6 3.3-4.51 6.16-4.51z"/>
      </svg>
      Entrar con Google
    </button>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--muted);font-size:12px">
      <span style="flex:1;height:1px;background:var(--line)"></span>o con contraseña<span style="flex:1;height:1px;background:var(--line)"></span>
    </div>

    <form id="login-form">
      <div class="field">
        <label for="li-email">Email</label>
        <input type="email" id="li-email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="li-pass">Contraseña</label>
        <input type="password" id="li-pass" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-dark" style="width:100%" id="li-btn">Entrar</button>
      <div class="login-msg" id="login-msg" role="status" aria-live="polite"></div>
    </form>
  </div>
</div>

<!-- ═══ APP ═════════════════════════════════════════════════ -->
<div id="app" hidden>

  <header class="topbar">
    <div class="brand">PRECISSA INSTITUTE<small>Agenda interna</small></div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="agenda">Agenda</button>
      <button class="tab" data-view="clientas">Clientas</button>
      <button class="tab" data-view="ajustes">Ajustes</button>
    </nav>
    <div class="topbar-right">
      <span class="user-chip" id="user-chip"></span>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Salir</button>
    </div>
  </header>

  <main>
    <!-- ── AGENDA ── -->
    <section class="view active" id="view-agenda">
      <div class="datenav">
        <button class="icon-btn" id="prev-btn" aria-label="Anterior">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="datenav-label">
          <strong id="date-label">—</strong>
          <span id="date-sub"></span>
        </div>
        <button class="icon-btn" id="next-btn" aria-label="Siguiente">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="btn btn-outline btn-sm" id="today-btn">Hoy</button>
        <div class="seg" id="mode-seg">
          <button data-mode="dia" class="active">Día</button>
          <button data-mode="semana">Semana</button>
        </div>
      </div>
      <div id="agenda-body"></div>
    </section>

    <!-- ── CLIENTAS ── -->
    <section class="view" id="view-clientas">
      <div class="view-head"><h1>Clientas</h1></div>
      <input type="search" class="search" id="cli-search" placeholder="Buscar por nombre, teléfono o email…" aria-label="Buscar clientas">
      <div id="clientas-body"></div>
    </section>

    <!-- ── FICHA ── -->
    <section class="view" id="view-ficha">
      <button class="btn btn-ghost btn-sm" id="ficha-back" style="margin-bottom:12px">← Volver</button>
      <div id="ficha-body"></div>
    </section>

    <!-- ── TRATAMIENTOS ── -->
    <section class="view" id="view-ajustes">
      <div class="view-head">
        <h1>Configuración</h1>
        <button class="btn btn-outline btn-sm" id="nuevo-trat-btn">Añadir</button>
      </div>
      <div class="seg" id="ajustes-seg" style="margin-bottom:14px;width:fit-content">
        <button data-tab="tratamientos" class="active">Tratamientos</button>
        <button data-tab="consentimientos">Consentimientos</button>
      </div>
      <p style="color:var(--muted);font-size:14px;margin-bottom:14px" id="ajustes-ayuda">
        Tu catálogo para agendar rápido: al elegir un tratamiento se rellenan solos la duración y el precio.
      </p>
      <div id="ajustes-body"></div>
    </section>
  </main>

  <!-- ── Barra inferior (móvil) ── -->
  <nav class="bottomnav" id="bottomnav">
    <button data-view="agenda" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Agenda</span>
    </button>
    <button data-view="clientas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
      <span>Clientas</span>
    </button>
    <button data-view="ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>

  <button class="fab" id="fab" aria-label="Nueva cita">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
</div>

<!-- ═══ MODALES ═════════════════════════════════════════════ -->
<div class="modal" id="modal">
  <div class="modal-panel" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 id="modal-title">—</h2>
      <button class="icon-btn" id="modal-close" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="/assets/js/supabase-config.js"></script>
<script src="agenda.js?v=5"></script>
</body>
</html>
