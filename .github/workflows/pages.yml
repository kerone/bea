name: Deploy GitHub Pages

# Lanza el deploy de Pages cada vez que main avanza.
# Tambien permite lanzarlo a mano desde la pestaña Actions de GitHub
# (boton "Run workflow"), util si algun deploy falla y quieres reintentar.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos necesarios para que el job pueda publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dos deploys se pisen si llegan muy seguidos.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (toda la raiz, web estatica sin build)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
